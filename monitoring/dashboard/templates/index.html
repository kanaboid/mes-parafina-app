<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MES — metryki hostów</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --ok: #3dd68c;
      --warn: #f5c451;
      --bad: #ff6b6b;
      --border: #2a3649;
      --accent: #5b9cf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.3rem; }
    .sub { color: var(--muted); margin-bottom: 1rem; font-size: 0.85rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .card h2 { margin: 0 0 0.2rem; font-size: 1.05rem; }
    .role { color: var(--muted); font-size: 0.8rem; margin: 0 0 0.75rem; }
    .role a { color: var(--accent); text-decoration: none; margin-left: 0.5rem; }
    .section { margin-bottom: 0.85rem; }
    .section:last-child { margin-bottom: 0; }
    .section-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.35rem; }
    .big { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.1rem 0;
      color: var(--muted);
    }
    .row span:last-child { color: var(--text); font-weight: 500; }
    .bar-wrap {
      height: 6px;
      background: #243044;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.35rem;
    }
    .bar { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
    .err { color: var(--bad); font-size: 0.85rem; }
    footer { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>MES — metryki hostów</h1>
  <p class="sub">Netdata · co {{ refresh_seconds }} s</p>
  <div id="grid" class="grid"></div>
  <footer id="status">Ładowanie…</footer>

  <script>
    const REFRESH_MS = {{ refresh_seconds }} * 1000;

    function barColor(pct) {
      if (pct >= 90) return 'var(--bad)';
      if (pct >= 75) return 'var(--warn)';
      return 'var(--ok)';
    }

    function section(title, content) {
      return `<div class="section"><div class="section-title">${title}</div>${content}</div>`;
    }

    function renderHost(item) {
      const disk = item.disk || {};
      const cpu = item.cpu || {};
      const ram = item.ram || {};

      let diskHtml = disk.ok
        ? `
          <div class="big" style="color:${barColor(disk.used_pct)}">${disk.used_pct}%</div>
          <div class="row"><span>zajęte</span><span>${disk.used_gib} GiB</span></div>
          <div class="row"><span>wolne</span><span>${disk.avail_gib} GiB</span></div>
          <div class="bar-wrap"><div class="bar" style="width:${disk.used_pct}%;background:${barColor(disk.used_pct)}"></div></div>
        `
        : `<div class="err">${disk.error || 'błąd'}</div>`;

      let cpuHtml = cpu.ok
        ? `<div class="big">${cpu.busy_pct}%</div><div class="row"><span>idle</span><span>${cpu.idle_pct}%</span></div>`
        : `<div class="err">${cpu.error || 'błąd'}</div>`;

      let ramHtml = ram.ok
        ? `
          <div class="big" style="color:${barColor(ram.used_pct)}">${ram.used_pct}%</div>
          <div class="row"><span>używane</span><span>${ram.used_gib} GiB</span></div>
          <div class="row"><span>wolne+cache</span><span>${ram.avail_gib} GiB</span></div>
        `
        : `<div class="err">${ram.error || 'błąd'}</div>`;

      return `
        <article class="card">
          <h2>${item.host}</h2>
          <p class="role">${item.role || ''}<a href="${item.netdata_url}" target="_blank" rel="noopener">netdata</a></p>
          ${section('Dysk /', diskHtml)}
          ${section('CPU', cpuHtml)}
          ${section('RAM', ramHtml)}
        </article>
      `;
    }

    async function refresh() {
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/metrics');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        grid.innerHTML = (data.hosts || []).map(renderHost).join('');
        status.textContent = 'Aktualizacja: ' + new Date().toLocaleString('pl-PL');
      } catch (err) {
        status.textContent = 'Błąd: ' + err.message;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
