# Netdata — metryki hosta i kontenerów Docker.
# Uruchom na każdym hoście: ./scripts/monitoring-start.sh netdata
# Panel lokalny (bez logowania): http://<host>:19999/v3
# Stary adres :19999/ pokazuje ekran „Sign-in” — to normalne w Netdata 2.x

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: ${MONITORING_HOSTNAME:-mes-host}
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - NETDATA_DISABLE_CLOUD=1
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_URL=${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS:-}
      - TZ=Europe/Warsaw
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
