<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal 1 - Zestawienie Zbiorników</title>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #757575;
            --border-color: #333;
            --accent-reactor: #d84315; 
            --accent-dirty: #f9a825;   
            --accent-clean: #2e7d32;   
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column; /* Ustawia sekcje jedna pod drugą (w pionie) */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5vh 2vw;
            background-color: #000;
            border-bottom: 2px solid var(--border-color);
            font-size: 1.8vh;
            color: var(--text-muted);
        }

        .clock {
            font-weight: bold;
            font-size: 2.2vh;
            color: #fff;
        }

        .wrapper {
            display: flex;
            flex-direction: column; /* Gwarancja pionowego układu sekcji */
            flex: 1;
            height: 100%;
        }

        .section {
            flex: 1; /* Każda z 3 sekcji zajmie dokładnie 1/3 wysokości ekranu */
            display: flex;
            flex-direction: column;
            margin: 0.5vh 0.5vw;
            background-color: var(--panel-bg);
            border-radius: 8px;
            overflow: hidden;
            border-left: 8px solid transparent; 
        }

        .section.reactor { border-left-color: var(--accent-reactor); }
        .section.dirty { border-left-color: var(--accent-dirty); }
        .section.clean { border-left-color: var(--accent-clean); }

        .section-title {
            font-size: 2.8vh;
            font-weight: bold;
            text-align: center;
            padding: 1.2vh;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 2px;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        .table-container::-webkit-scrollbar { width: 0px; background: transparent; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 2.2vh 1.5vw;
            font-size: 2.6vh; /* Znacznie większa czcionka, bo nie mamy nagłówków */
            border-bottom: 1px solid var(--border-color);
        }

        .col-name { 
            width: 20%; 
            font-weight: bold; 
            color: #fff;
        }
        
        .col-mix { 
            width: 55%; 
            color: #90caf9; /* Jasnoniebieski dla nazwy */
        }
        
        .col-qty { 
            width: 25%; 
            text-align: right; 
            font-family: monospace; 
            font-size: 3vh; 
            font-weight: bold;
            color: #a5d6a7; /* Delikatny zielony dla wag */
        }

        .empty-mix {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div>MES Parafina - Terminal 1</div>
        <div class="clock" id="clock">00:00:00</div>
    </header>

    <div class="wrapper">
        <!-- SEKCJA REAKTORY -->
        <div class="section reactor">
            <div class="section-title">REAKTORY</div>
            <div class="table-container">
                <table id="table-reactors">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>

        <!-- SEKCJA STREFA BRUDNA -->
        <div class="section dirty">
            <div class="section-title">STREFA BRUDNA</div>
            <div class="table-container">
                <table id="table-dirty">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>

        <!-- SEKCJA STREFA CZYSTA -->
        <div class="section clean">
            <div class="section-title">STREFA CZYSTA</div>
            <div class="table-container">
                <table id="table-clean">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Zegar czasu rzeczywistego
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pl-PL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Połączenie Socket.IO
        const socket = io();

        // Pierwsze pobranie danych
        fetch('/api/dashboard/main-status')
            .then(response => response.json())
            .then(data => updateTables(data))
            .catch(err => console.error("Błąd pobierania danych:", err));

        // Nasłuchiwanie na aktualizacje
        socket.on('dashboard_update', function(data) {
            updateTables(data);
        });

        // 3. Logika renderowania
        function updateTables(data) {
            renderTable('table-reactors', data.all_reactors);
            renderTable('table-dirty', data.beczki_brudne);
            renderTable('table-clean', data.beczki_czyste);
        }

        function renderTable(tableId, equipmentList) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = ''; 

            if (!equipmentList || equipmentList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;" class="empty-mix">Brak urządzeń w tej strefie</td></tr>`;
                return;
            }

            equipmentList.forEach(eq => {
                const tr = document.createElement('tr');
                
                // 1 kolumna: Nazwa sprzętu (np. R1, B01b)
                const nameCell = `<td class="col-name">${eq.nazwa}</td>`;
                
                // 2 kolumna: Nazwa oparta na składzie (np. T-10 + 19) zamiast kodu partii
                let mixName = '<span class="empty-mix">Pusty</span>';
                if (eq.partia && eq.partia.sklad && eq.partia.sklad.length > 0) {
                    // Wyciągamy nazwy surowców ze składu i łączymy plusem
                    mixName = eq.partia.sklad.map(s => s.material_type).join(' + ');
                }

                const mixCell = `<td class="col-mix">${mixName}</td>`;

                // 3 kolumna: Ilość w tonach (priorytet: odczyt czujnika -> waga logiczna -> puste)
                let qtyTons = '-';
                if (eq.poziom_tony !== null && eq.poziom_tony !== undefined) {
                    qtyTons = eq.poziom_tony.toFixed(2) + ' t';
                } else if (eq.partia && eq.partia.waga_kg !== null && eq.partia.waga_kg !== undefined) {
                    qtyTons = (eq.partia.waga_kg / 1000).toFixed(2) + ' t';
                } else if (eq.pojemnosc_kg !== null) {
                    qtyTons = '-'; 
                }

                const qtyCell = `<td class="col-qty">${qtyTons}</td>`;

                tr.innerHTML = nameCell + mixCell + qtyCell;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
