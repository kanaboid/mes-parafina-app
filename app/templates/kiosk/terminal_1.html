<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal 1 - Zestawienie Zbiorników</title>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #757575;
            --border-color: #333;
            --accent-reactor: #d84315; 
            --accent-dirty: #f9a825;   
            --accent-clean: #2e7d32;   
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5vh 2vw;
            background-color: #000;
            border-bottom: 2px solid var(--border-color);
            font-size: 2vw;
            color: var(--text-muted);
        }

        .clock {
            font-weight: bold;
            font-size: 2.5vw;
            color: #fff;
        }

        .wrapper {
            display: flex;
            flex-direction: row; 
            flex: 1;
            height: 100%;
            padding: 1vw;
            gap: 1vw; 
        }

        .section {
            flex: 1; 
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border-radius: 8px;
            overflow: hidden;
            border-top: 6px solid transparent; 
        }

        .section.reactor { border-top-color: var(--accent-reactor); }
        .section.dirty { border-top-color: var(--accent-dirty); }
        .section.clean { border-top-color: var(--accent-clean); }

        .section-title {
            font-size: 2.5vw;
            font-weight: bold;
            text-align: center;
            padding: 1.5vh 0;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 1px;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        .table-container::-webkit-scrollbar { width: 0px; background: transparent; }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; 
        }

        td {
            padding: 1.5vh 0.5vw;
            border-bottom: 1px solid var(--border-color);
            word-wrap: break-word;
            vertical-align: middle;
        }

        .col-name { 
            width: 18%; 
            font-size: 2vw;
            font-weight: bold; 
            color: #fff;
            text-align: center;
        }
        
        .col-mix { 
            width: 37%; 
            font-size: 1.8vw;
            color: #90caf9; 
            line-height: 1.2;
        }
        
        .col-logical-qty { 
            width: 22.5%; 
            text-align: right; 
            font-family: monospace; 
            font-size: 2vw; 
            font-weight: bold;
            color: #a5d6a7; 
        }

        .col-sensor-qty {
            width: 22.5%;
            text-align: right;
            font-family: monospace;
            font-size: 2vw;
            font-weight: bold;
            color: #ffb74d; 
            padding-right: 1vw;
        }

        .empty-mix {
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- Nowe style dla metadanych reaktora --- */
        .whiteboard {
            color: #fff;
            font-weight: bold;
            margin-left: 0.3vw;
        }

        .mix-meta {
            font-size: 1.1vw; /* Mniejsza czcionka dla statusu */
            color: #ffcc80; /* Delikatny pomarańcz/żółty dla odróżnienia */
            font-family: monospace;
            margin-top: 0.5vh;
            display: block; /* Wymusza nową linię */
        }
    </style>
</head>
<body>

    <header>
        <div>MES Parafina - Terminal 1</div>
        <div class="clock" id="clock">00:00:00</div>
    </header>

    <div class="wrapper">
        <!-- SEKCJA STREFA CZYSTA -->
        <div class="section clean">
            <div class="section-title">STREFA CZYSTA</div>
            <div class="table-container">
                <table id="table-clean">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>

        <!-- SEKCJA STREFA BRUDNA -->
        <div class="section dirty">
            <div class="section-title">STREFA BRUDNA</div>
            <div class="table-container">
                <table id="table-dirty">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>

        <!-- SEKCJA REAKTORY -->
        <div class="section reactor">
            <div class="section-title">REAKTORY</div>
            <div class="table-container">
                <table id="table-reactors">
                    <tbody><!-- Renderowane przez JS --></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Zegar
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pl-PL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Socket.IO
        const socket = io();

        fetch('/api/dashboard/main-status')
            .then(response => response.json())
            .then(data => updateTables(data))
            .catch(err => console.error("Błąd pobierania danych:", err));

        socket.on('dashboard_update', function(data) {
            updateTables(data);
        });

        // Logika
        function updateTables(data) {
            renderTable('table-reactors', data.all_reactors);
            renderTable('table-dirty', data.beczki_brudne);
            renderTable('table-clean', data.beczki_czyste);
        }

        function renderTable(tableId, equipmentList) {
            const tbody = document.querySelector(`#${tableId} tbody`);
            tbody.innerHTML = ''; 

            if (!equipmentList || equipmentList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;" class="empty-mix">Brak urządzeń w strefie</td></tr>`;
                return;
            }

            equipmentList.forEach(eq => {
                const tr = document.createElement('tr');
                
                // Kolumna 1: Nazwa sprzętu
                const nameCell = `<td class="col-name">${eq.nazwa}</td>`;
                
                // Kolumna 2: Zawartość oparta na składzie + ewentualnie dane z reaktora
                let mixNameHTML = '<span class="empty-mix">Pusty</span>';
                
                if (eq.partia) {
                    // Sklejanie nazwy składu
                    let mainName = "Brak składu";
                    if (eq.partia.sklad && eq.partia.sklad.length > 0) {
                        mainName = eq.partia.sklad.map(s => s.material_type).join(' + ');
                    } else if (eq.partia.kod) {
                        mainName = eq.partia.kod; // Fallback
                    }
                    
                    mixNameHTML = mainName;

                    // --- Specyficzne dla Reaktorów ---
                    if (tableId === 'table-reactors') {
                        // 1. Identyfikator z tablicy
                        if (eq.partia.whiteboard_id) {
                            mixNameHTML += `<span class="whiteboard">(${eq.partia.whiteboard_id})</span>`;
                        }
                        
                        // 2. Metadane: Status procesu i liczniki w nowej linii
                        let metaItems =[];
                        
                        if (eq.partia.process_status) {
                            metaItems.push(eq.partia.process_status);
                        }
                        if (eq.partia.filtration_cycles_count != null) {
                            metaItems.push(`${eq.partia.filtration_cycles_count}x`);
                        }
                        if (eq.partia.bleaching_earth_bags_total != null) {
                            metaItems.push(`${eq.partia.bleaching_earth_bags_total}W`);
                        }
                        
                        if (metaItems.length > 0) {
                            mixNameHTML += `<div class="mix-meta">${metaItems.join(' &bull; ')}</div>`;
                        }
                    }
                }

                const mixCell = `<td class="col-mix">${mixNameHTML}</td>`;

                // Kolumna 3: Ilość księgowa
                let logicalTons = '<span class="empty-mix">-</span>';
                if (eq.partia && eq.partia.waga_kg !== null && eq.partia.waga_kg !== undefined) {
                    logicalTons = (eq.partia.waga_kg / 1000).toFixed(1) + ' t';
                }
                const logicalCell = `<td class="col-logical-qty">${logicalTons}</td>`;

                // Kolumna 4: Ilość z czujnika
                let sensorTons = '<span class="empty-mix">-</span>';
                if (eq.poziom_tony !== null && eq.poziom_tony !== undefined) {
                    sensorTons = eq.poziom_tony.toFixed(1) + ' t';
                }
                const sensorCell = `<td class="col-sensor-qty">${sensorTons}</td>`;

                tr.innerHTML = nameCell + mixCell + logicalCell + sensorCell;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
